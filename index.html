<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>REblox</title>
<style>
:root{--y:#ffd400;--y2:#ffb800;--b0:#070707;--b1:#111;--b2:#1b1b1b;--b3:#282828;--tx:#f4f4f4;--mut:#9a9a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--b0);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}
.screen{position:fixed;inset:0}
.hidden{display:none!important}

/* ===== BERANDA ===== */
#home{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#3a3000 0%,var(--b0) 60%)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
#logo,.logoFb{width:38px;height:38px;border-radius:9px;object-fit:cover}
.logoFb{display:none;place-items:center;background:var(--y);color:#000;font-weight:900}
.wm{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--y)}.wm b{color:#fff}
.chips{display:flex;gap:6px}
.chip{background:var(--b2);border:1px solid #333;border-radius:20px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.chip.rb{color:var(--y)}
nav{display:flex;background:#0a0a0a;border-top:1px solid #222;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#999;font-weight:600}
nav button span{font-size:22px;filter:grayscale(1) brightness(1.5)}
nav button.on{color:var(--y)}nav button.on span{filter:none}
main{flex:1;overflow-y:auto;padding:6px 14px 100px}
.card{background:var(--b1);border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:16px 0 8px;color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gc{background:var(--b1);border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:92px;display:grid;place-items:center;font-size:42px}
.gc .in{padding:8px 10px}
.gc .nm{font-weight:800;font-size:14px}
.gc .sub{font-size:11px;color:var(--mut);margin:2px 0 8px}
.btn{background:var(--y);color:#000;font-weight:800;border-radius:10px;padding:9px 14px}
.btn.alt{background:var(--b3);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.red{background:#ff3b30;color:#fff}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap}
#studioFab{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;background:var(--y);color:#000;border-radius:18px;padding:10px 16px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #8a6d00,0 8px 20px #0009}
#studioFab:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6d00}
.hero{display:flex;align-items:center;justify-content:space-between;overflow:hidden;background:linear-gradient(135deg,#231d00,#000)}
.scene3d{width:100px;height:100px;perspective:420px;flex:none}
.cube{width:60px;height:60px;margin:20px;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite}
.cube i{position:absolute;inset:0;border:3px solid #000;background:var(--y)}
.cube i:nth-child(even){background:#111;border-color:var(--y)}
.cube i:nth-child(1){transform:translateZ(30px)}
.cube i:nth-child(2){transform:rotateY(90deg) translateZ(30px)}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(30px)}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(30px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(30px)}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(30px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.xrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0}
.xrow button{width:48px;height:48px;border-radius:14px;background:var(--b3);font-size:24px;font-weight:900}
.xn{font-size:40px;font-weight:900;color:var(--y);min-width:80px;text-align:center}
.muted{color:var(--mut);font-size:12px}
.item{background:var(--b1);border:1px solid #2a2a2a;border-radius:14px;padding:8px;text-align:center}
.item.on{border-color:var(--y)}
.sw{width:100%;height:46px;border-radius:10px;display:grid;place-items:center;font-size:26px;margin-bottom:6px;border:2px solid #000}
.item .nm{font-size:12px;font-weight:700;margin-bottom:6px}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.av .hat{font-size:26px;height:28px;line-height:28px}
.av .head{width:44px;height:44px;border-radius:8px;border:2px solid #000;position:relative}
.av .head:before{content:"•  •";position:absolute;inset:12px 0 0;text-align:center;color:#000;font-size:14px;letter-spacing:2px}
.av .bd{display:flex;gap:3px}
.av .arm{width:18px;height:62px;border-radius:5px;border:2px solid #000}
.av .torso{width:62px;height:62px;border-radius:6px;border:2px solid #000}
.av .legs{display:flex;gap:3px}
.av .legs div{width:30px;height:60px;border-radius:5px;border:2px solid #000}
input.txt{background:var(--b2);border:1px solid #333;color:#fff;border-radius:10px;padding:10px;width:100%}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222}
.hist div{font-size:12px;color:#bbb;padding:4px 0;border-bottom:1px solid #1d1d1d}

.ib{background:none;font-size:22px;width:40px;height:40px;position:relative;color:#fff}
.ib i.dot{position:absolute;top:7px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--y)}
.ib i.badge{position:absolute;top:1px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--y);color:#000;font-style:normal;font-size:11px;font-weight:900;line-height:17px;text-align:center;display:none}
.ib i.badge.on{display:block}
.brand{gap:2px}
.prof{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.pav{width:64px;height:64px;border-radius:50%;border:2px solid var(--y);display:grid;place-items:center;font-size:30px;flex:none}
.pname{font-size:26px;font-weight:800}
.sech{font-size:21px;font-weight:800;margin:16px 0 10px}
.frow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.fr{flex:none;width:84px;text-align:center;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .fc{overflow:hidden;width:84px;height:84px;border-radius:50%;background:var(--b3);display:grid;place-items:center;font-size:32px;margin-bottom:6px;font-weight:800}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.rc{position:relative}
.rt{border-radius:12px;display:grid;place-items:center;font-size:46px;aspect-ratio:16/10;position:relative}
.rc .nm{font-weight:800;font-size:15px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .fc .ico svg{width:38px;height:38px}.fav svg{display:block;margin:auto}
.rc .rate{color:#aaa;font-size:13px}
.fav{position:absolute;top:6px;right:6px;background:#0008;border-radius:50%;width:30px;height:30px;font-size:15px}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #222}
.rank .n{font-size:20px;font-weight:900;color:var(--y);width:28px}
.rank .e{width:56px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:22px}
#drawer{position:fixed;inset:0;z-index:20;display:flex}
.dpanel{width:86%;max-width:340px;background:#121212;height:100%;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 24px}
.dback{flex:1;background:#0009}
.dprof{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.dbal{border:1px solid #333;border-radius:12px;margin-bottom:10px}
.dbal>div{padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.dbal>div+div{border-top:1px solid #333;font-weight:600;font-size:14px}
.dit{display:flex;gap:16px;align-items:center;padding:13px 6px;font-size:18px;font-weight:700;width:100%;background:none;text-align:left}
.dit span{width:26px;text-align:center}
.dsep{border-top:1px solid #333;margin:8px 0}

#studioFab{padding:0;width:58px;height:58px;border-radius:16px;overflow:hidden;background:#000;border:2px solid #000}
#studioFab img{width:100%;height:100%;display:block;object-fit:cover}
nav button span{filter:none}
nav button svg,.ib svg,.dit svg,.bal svg{width:24px;height:24px;display:block}
.ib span{display:flex;align-items:center;justify-content:center}
.bal{display:flex;gap:6px;align-items:center}
.pav{overflow:hidden;background:#222}
.pav svg{display:block}
.rt,.rank .e{position:relative;overflow:hidden}
.tool span svg{margin:0 auto;display:block}

#auth{background:#050505;overflow:hidden}
#authBg{position:absolute;inset:-25%;transform:rotate(-14deg);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}
#authBg .t{border-radius:22px;overflow:hidden;aspect-ratio:1/1.05;position:relative;background:#111}
#authBg .t:nth-child(even){transform:translateY(46px)}
.authShade{position:absolute;inset:0;background:linear-gradient(#000b,#000d 50%,#000f)}
#authBox{position:absolute;inset:0;display:flex;padding:calc(56px + env(safe-area-inset-top)) 20px 28px;overflow-y:auto}
.aform{width:100%;max-width:340px;margin:auto}
.alogo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:26px}
.alogo img{width:56px;height:56px;border-radius:12px}
.alogo .wm{font-size:44px}
.abtn{display:block;width:100%;padding:14px;border-radius:10px;font-weight:800;font-size:16px;margin-top:12px;background:var(--y);color:#000;text-align:center}
.abtn.out{background:#0006;color:#ddd;border:1px solid #777}
.afield{margin-bottom:14px}.afield label{display:block;font-size:13px;color:#bbb;margin-bottom:6px}
.afield input{width:100%;background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:8px;padding:13px;font-size:16px;color-scheme:dark}
.pwrap{position:relative}.pwrap input{padding-right:46px}
.pwrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;color:#aaa;width:38px;height:38px}
.pwrap svg{width:22px;height:22px}
.gsel{display:flex;border:1px solid #333;border-radius:8px;overflow:hidden}
.gsel button{flex:1;padding:11px 4px;background:#1c1c1c;color:#aaa;display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.gsel button+button{border-left:1px solid #333}.gsel button.on{background:var(--y);color:#000}
.aerr{color:#ff6b5e;font-size:13px;min-height:18px;text-align:center;margin-bottom:2px}
.alinks{display:flex;gap:22px;justify-content:center;margin-top:20px}
.alinks button{background:none;color:#6cb4ff;text-decoration:underline;font-size:13px}
.atop{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:2}
.atop svg{width:26px;height:26px}
.atitle{font-size:24px;font-weight:900;text-align:center;margin-bottom:18px}
.bsel{display:flex;gap:8px}
.bsel select{flex:1;min-width:0;background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:8px;padding:13px 6px;font-size:16px;color-scheme:dark}
button{touch-action:manipulation}
#zoomBox{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#zoomBox button{width:44px;height:44px;border-radius:12px;background:#000a;border:2px solid var(--y);color:var(--y);font-size:26px;font-weight:900;line-height:1}

#dlg{position:fixed;inset:0;z-index:200;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:#161616;border:2px solid var(--y);border-radius:16px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.dt{font-size:18px;font-weight:900;color:var(--y);margin-bottom:8px}.dm{font-size:14px;color:#ddd;white-space:pre-wrap;margin-bottom:10px;line-height:1.5}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.seg{display:flex;gap:6px;justify-content:center;margin-top:10px}.seg button{background:var(--b3);padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px}.seg button.on{background:var(--y);color:#000}
.item .th{display:block;background:#222;border-radius:10px;margin-bottom:6px;overflow:hidden}.ith{height:64px;display:grid;place-items:center;color:var(--y)}.ith svg{width:34px;height:34px}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.frow2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #222}.frow2 b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav2{width:48px;height:48px;border-radius:50%;background:#2a2a2a;overflow:hidden;flex:none}

#pick,#item{display:grid;grid-template-rows:44px 1fr;background:#0d0d0d}
.pkbody{display:flex;gap:16px;padding:16px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));justify-content:center;align-items:stretch;min-height:0}
.pkc{flex:1;max-width:340px;background:var(--b1);border:2px solid var(--y);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff}
.pkc svg{width:54px;height:54px;color:var(--y)}.pkc b{font-size:19px;color:var(--y)}.pkc span{font-size:12px;color:#aaa;line-height:1.5}.pkc:active{background:var(--b3)}
.sbar svg{width:20px;height:20px;display:block}
.itmain{display:grid;grid-template-columns:92px 1fr 36%;min-height:0}
.ittabs{background:var(--b1);overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:5px}
.ittabs button{background:var(--b3);border-radius:10px;padding:10px 2px;font-size:12px;font-weight:700}.ittabs button.on{background:var(--y);color:#000}
.itform{overflow-y:auto;padding:10px;font-size:13px}
.fh{font-weight:900;color:var(--y);margin:8px 0 6px}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.chs button{background:var(--b3);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700}.chs button.on{background:var(--y);color:#000}
.fl{display:block;margin:10px 0;color:#ccc}.fl input[type=range]{width:100%}.fl input[type=color]{display:block;width:100%;height:34px;border:0;background:none;padding:0;margin-top:4px}
.stp{display:flex;align-items:center;gap:6px;margin-bottom:8px}.stp select{background:#1c1c1c;color:#fff;border:1px solid #333;border-radius:8px;padding:6px;font-size:12px;max-width:110px}.stp input{flex:1;min-width:0}.stp button{background:var(--b3);width:28px;height:28px;border-radius:6px;font-weight:900}
.itprev{position:relative;min-height:0;border-left:1px solid #2a2a2a}#icanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.itrig{position:absolute;top:6px;left:6px;display:flex;gap:4px}.itrig button{background:#000a;border:1px solid #555;color:#ddd;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:800}.itrig button.on{background:var(--y);color:#000}
#emoteBtn{position:absolute;right:calc(120px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#000a;border:3px solid var(--y);color:var(--y);display:grid;place-items:center}
#emoteBtn svg{width:28px;height:28px}
#emotePanel{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(130px + env(safe-area-inset-bottom));background:#000d;border:2px solid var(--y);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-width:260px;max-height:50vh;overflow-y:auto}
#emotePanel button{background:var(--b3);color:#fff;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px}

/* ===== GAME ===== */
#game{background:#000;touch-action:none}
@media (orientation:portrait){#studio .rotwarn,#pick .rotwarn,#item .rotwarn{display:flex}}
#gcanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#look{position:absolute;inset:0;touch-action:none}
.hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.hud button{pointer-events:auto;background:#000a;border:2px solid var(--y);color:var(--y);border-radius:10px;width:42px;height:42px;font-size:18px;font-weight:900}
.hbox{background:#000a;border:1px solid #444;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;display:flex;gap:10px}
.gname{background:#000a;border-radius:12px;padding:6px 12px;font-weight:900;font-size:13px;color:var(--y);max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--y);opacity:.9}
#jumpBtn{position:absolute;right:calc(24px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:var(--y);color:#000;font-size:30px;font-weight:900;border:4px solid #000;box-shadow:0 0 0 3px var(--y);touch-action:none}
#jumpBtn:active{background:var(--y2)}
.gmsg{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:22px;font-weight:900;color:var(--y);text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 20px}
.gmsg.on{opacity:1}
#pauseMenu{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center}
#pauseMenu .card{min-width:240px;text-align:center;border:2px solid var(--y)}
#pauseMenu .btn{display:block;width:100%;margin-top:8px}
.tip{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;color:#fff8;pointer-events:none}

/* ===== STUDIO ===== */
#studio{display:grid;grid-template-rows:44px 1fr;background:#0d0d0d}
.sbar{display:flex;align-items:center;gap:6px;padding:4px calc(8px + env(safe-area-inset-right)) 4px calc(8px + env(safe-area-inset-left));background:#000;border-bottom:2px solid var(--y);overflow-x:auto;scrollbar-width:none}
.sbar button{background:var(--b3);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.sbar .y{background:var(--y);color:#000}
.sbar input{background:var(--b2);border:1px solid #333;color:#fff;border-radius:8px;padding:6px 8px;width:130px;font-size:13px}
.sbar .cnt{color:var(--mut);font-size:11px;white-space:nowrap}
.smain{display:grid;grid-template-columns:72px 1fr 214px;min-height:0}
.tools{background:var(--b1);overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:5px}
.tool{background:var(--b3);border-radius:10px;padding:6px 2px;font-size:10px;text-align:center;line-height:1.2}
.tool span{display:block;font-size:20px}
.tool:active{background:var(--y);color:#000}
.view{position:relative;min-width:0;min-height:0}
#scanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.vhint{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff9;pointer-events:none;text-shadow:0 1px 3px #000}
.panel{background:var(--b1);display:flex;flex-direction:column;min-height:0;border-left:1px solid #2a2a2a;padding-right:env(safe-area-inset-right)}
.ptabs{display:flex}
.ptabs button{flex:1;padding:8px 2px;background:var(--b2);font-size:12px;font-weight:700;color:#aaa}
.ptabs button.on{background:var(--y);color:#000}
.pbody{flex:1;overflow-y:auto;padding:8px;font-size:12px}
.ptitle{font-weight:900;color:var(--y);margin-bottom:6px;font-size:13px}
.snap{display:flex;gap:4px;align-items:center;margin-bottom:6px;color:var(--mut)}
.sn{background:var(--b3);border-radius:6px;padding:4px 8px;font-weight:800;font-size:12px}
.sn.on{background:var(--y);color:#000}
.prow{display:flex;align-items:center;gap:4px;margin:4px 0}
.prow label{width:50px;color:var(--mut);font-size:11px}
.prow button{width:28px;height:28px;background:var(--b3);border-radius:6px;font-weight:900;flex:none}
.prow input{flex:1;min-width:0;width:100%;background:var(--b2);border:1px solid #333;color:#fff;border-radius:6px;padding:4px;text-align:center;height:28px}
.sws{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.swc{width:24px;height:24px;border-radius:6px;border:2px solid #000}
.pb2{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pb2 button{background:var(--b3);padding:7px 9px;border-radius:8px;font-weight:700;font-size:12px}
.pb2 .r{background:#ff3b30}
.hint{color:var(--mut);line-height:1.5}
.orow{padding:7px 6px;border-radius:8px;background:var(--b2);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.orow.on{background:var(--y);color:#000;font-weight:800}
.wrow{margin-bottom:10px}.wrow label{display:block;color:var(--mut);margin-bottom:4px}
.wrow input[type=color]{width:100%;height:34px;border:0;background:none;padding:0}
.rotwarn{display:none;position:absolute;inset:0;z-index:50;background:#000;color:var(--y);flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;gap:14px;padding:20px;font-size:18px}

#toast{pointer-events:none;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--y);color:#000;font-weight:800;padding:10px 16px;border-radius:14px;z-index:99;transition:transform .3s;max-width:90vw;text-align:center;font-size:13px}
#toast.on{transform:translate(-50%,0)}
</style>
</head>

function genObby(){
 const a=[P('spawn',0,-.5,0,8,1,8)];let z=0,h=0,prevLen=8,gap=2.6;
 for(let i=1;i<=26;i++){
  const long=i%4===2,len=long?8:4;
  z-=prevLen/2+gap+len/2;
  const x=Math.sin(i*1.3)*2.5,col=i%2?'#ffd400':'#1a1a1a';
  if(i%6===3){a.push(P('jump',x,h-.25,z,3,.5,3));h+=4;gap=5;prevLen=3;continue}
  if(i%5===0){a.push(P('check',x,h-.2,z,5,.4,5));prevLen=5;gap=2.6;a.push(P('coin',x,h+1.5,z,1,1,1));continue}
  a.push(P('block',x,h-.5,z,4.5,1,len,col));
  if(long)a.push(P('lava',x,h+.25,z,4.5,.5,1.2));
  a.push(P('coin',x,h+1.6,z-(long?2.6:0),1,1,1));
  h+=.5;prevLen=len;gap=2.6;
 }
 z-=prevLen/2+3+3;a.push(P('finish',0,h-.25,z,6,.5,6));
 return{name:'Obby Kuning-Hitam',sky:'#0b0b14',ground:'#111111',base:false,parts:a}}

function rebuildScene(){
 Object.values(meshes).forEach(m=>sScene.remove(m));meshes={};if(groundMesh){sScene.remove(groundMesh);groundMesh=null}

async function hashPw(pw,salt){const t=salt+':'+pw;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return'x'+h}
const rndSalt=()=>{try{return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)}};

async function doSignup(b,user,pw){
 const pb=(b||'').split('-').map(Number),d=new Date(pb[0],(pb[1]||1)-1,pb[2]||1);if(!b||d.getMonth()!==pb[1]-1||d>new Date())return aerr('Pilih tanggal lahir yang valid');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(user))return aerr('Username 3-16 karakter: huruf, angka, atau _');
 if(pw.length<6)return aerr('Password minimal 6 karakter');
 if(CL.ok)return cloudSignup(user,pw);
 const key=user.toLowerCase();if(A.users[key])return aerr('Username sudah dipakai');
 const salt=rndSalt(),hash=await hashPw(pw,salt),first=!Object.keys(A.users).length;
 A.users[key]={name:user,salt,hash,bday:b,gender:AUI.gender};
 if(first){try{const old=localStorage.getItem('reblox_save_v1');if(old&&!localStorage.getItem('reblox_save_v1_u_'+key))localStorage.setItem('reblox_save_v1_u_'+key,old)}catch(e){}}
 saveA();beep(800,.15);loginAs(key);toast('Selamat datang, '+user+'!')}
async function doLogin(user,pw){
 if(CL.ok)return cloudLogin(user,pw);
 const key=user.toLowerCase(),u=A.users[key];if(!u)return aerr('Username atau password salah');
 if(await hashPw(pw,u.salt)!==u.hash)return aerr('Username atau password salah');
 beep(800,.15);loginAs(key)}

function cloudSave(){if(!CL.ok||!CL.uid||!MYKEY||CL.t)return;CL.t=setTimeout(()=>{CL.t=0;cloudFlush()},15000)}
function cloudFlush(){if(!CL.ok||!CL.uid||!MYKEY)return null;if(CL.t){clearTimeout(CL.t);CL.t=0}
 let j=JSON.stringify(S);if(j.length>900000)j=JSON.stringify(Object.assign({},S,{draft:null}));
 return Promise.all([CL.db.doc('saves/'+CL.uid).set({save:j,t:Date.now()}),CL.db.doc('users/'+MYKEY).set({key:MYKEY,name:ME,uid:CL.uid,pub:pubOf()},{merge:true})]).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudFlush()});addEventListener('pagehide',()=>{cloudFlush()});
async function loadUsers(keys){await Promise.all(keys.filter(k=>k&&k!==MYKEY).map(async k=>{try{const d=await CL.db.doc('users/'+k).get();if(d.exists)CL.cache[k]=d.data()}catch(e){}}))}
async function searchUsers(qs){const now=Date.now();if(!CL.ul||now-CL.ult>20000){const sn=await CL.db.collection('users').limit(300).get();CL.ul=[];sn.docs.forEach(d=>{const u=d.data();if(u&&u.key){CL.cache[u.key]=u;CL.ul.push(u.key)}});CL.ult=now}
 return CL.ul.filter(k=>k!==MYKEY&&!S.friends.includes(k)&&(!qs||k.includes(qs)||String((CL.cache[k]||{}).name||'').toLowerCase().includes(qs)))}
function cloudEnter(key,name,sv){ME=name;MYKEY=key;SKEY='reblox_save_v1_u_'+key;S=fixSave(Object.assign(defSave(),sv||{}));S.name=name;S.friends=S.friends.map(f=>String(f).toLowerCase()).filter(f=>f&&f!==key);
 try{localStorage.setItem('reblox_in','1')}catch(e){}hideBoot();persist();cloudFlush();XN=1;tab='home';q='';updateChips();show('home');setTab('home');cloudSync()}
async function cloudSync(){try{
 const mine=MK.items.filter(i=>i.by===MYKEY);
 const [it,gs,sl]=await Promise.all([CL.db.collection('items').limit(300).get(),CL.db.collection('games').orderBy('date','desc').limit(20).get(),CL.db.collection('sales').where('toUid','==',CL.uid).get()]);
 MK.items=it.docs.map(d=>d.data());const ids=new Set(MK.items.map(i=>i.id));
 mine.filter(i=>!ids.has(i.id)).forEach(i=>{i.uid=CL.uid;MK.items.push(i);CL.db.doc('items/'+i.id).set(i).catch(()=>{})});saveMK();
 CL.games=gs.docs.map(d=>d.data());
 let sum=0;sl.docs.forEach(d=>{sum+=d.data().amt||0;d.ref.delete().catch(()=>{})});
 if(sum){S.rebux+=sum;S.earned=(S.earned||0)+sum;persist();toast('Kamu dapat '+sum+' reBux dari penjualan item!')}
 await loadUsers(S.friends)}catch(e){toast('Sebagian data online gagal dimuat')}
 updateChips();renderMain()}
async function cloudAfterAuth(key){CL.uid=CL.auth.currentUser.uid;let name=key,sv=null;
 try{const ud=await CL.db.doc('users/'+key).get();if(ud.exists)name=ud.data().name||key}catch(e){}
 try{const d=await CL.db.doc('saves/'+CL.uid).get();if(d.exists)sv=JSON.parse(d.data().save)}catch(e){}
 if(!sv){try{const raw=localStorage.getItem('reblox_save_v1_u_'+key);if(raw)sv=JSON.parse(raw)}catch(e){}}
 cloudEnter(key,name,sv)}
function showBoot(){if($('#bootv'))return;const d=document.createElement('div');d.id='bootv';d.style.cssText='position:fixed;inset:0;z-index:99999;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#ffd400;font:700 16px system-ui,sans-serif';let src='';try{src=$('#logo').src}catch(e){}d.innerHTML=(src?'<img src="'+src+'" style="width:88px;height:88px;border-radius:18px">':'')+'<div>Memuat...</div>';document.body.appendChild(d);setTimeout(hideBoot,20000)}
function hideBoot(){const d=$('#bootv');if(d)d.remove()}
const CRK='reblox_cred_v1';
function saveCred(k,p){try{if(k)localStorage.setItem(CRK,btoa(unescape(encodeURIComponent(JSON.stringify({k,p})))));else localStorage.removeItem(CRK)}catch(e){}}
function getCred(){try{const r=localStorage.getItem(CRK);return r?JSON.parse(decodeURIComponent(escape(atob(r)))):null}catch(e){return null}}
async function cloudSignup(user,pw){const key=user.toLowerCase();
 try{await CL.auth.createUserWithEmailAndPassword(emailOf(key),pw)}catch(e){return aerr(authMsg(e))}
 CL.uid=CL.auth.currentUser.uid;
 try{await CL.db.doc('users/'+key).set({key,name:user,uid:CL.uid,gender:AUI.gender||'',pub:{}})}catch(e){}
 let sv=null;try{const raw=localStorage.getItem('reblox_save_v1_u_'+key)||(!Object.keys(A.users).length?localStorage.getItem('reblox_save_v1'):null);if(raw)sv=JSON.parse(raw)}catch(e){}
 saveCred(key,pw);beep(800,.15);cloudEnter(key,user,sv);toast('Selamat datang, '+user+'!')}
async function cloudLogin(user,pw){const key=user.toLowerCase();
 try{await CL.auth.signInWithEmailAndPassword(emailOf(key),pw)}catch(e){
  const u=A.users[key];
  if(u&&['auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials'].includes(e.code)&&(await hashPw(pw,u.salt))===u.hash){
   try{await CL.auth.createUserWithEmailAndPassword(emailOf(key),pw);CL.uid=CL.auth.currentUser.uid;await CL.db.doc('users/'+key).set({key,name:u.name,uid:CL.uid,pub:{}})}catch(e2){return aerr(authMsg(e2))}
  }else return aerr(authMsg(e))}
 saveCred(key,pw);beep(800,.15);await cloudAfterAuth(key)}
function boot(){cloudInit();try{const u=$('#logo').src;['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)})}catch(e){}buildAuthBg();if(CL.ok){let wasIn=false;try{wasIn=!!localStorage.getItem('reblox_in')}catch(e){}if(wasIn||getCred())showBoot();AUI.v='welcome';renderAuth();show('auth');let first=true;CL.auth.onAuthStateChanged(u=>{if(!first)return;first=false;if(u&&u.email){cloudAfterAuth(u.email.split('@')[0]);return}const c=getCred();if(!(c&&c.k&&c.p))hideBoot();if(c&&c.k&&c.p){CL.auth.signInWithEmailAndPassword(emailOf(c.k),c.p).then(()=>cloudAfterAuth(c.k)).catch(e=>{hideBoot();if(e&&/user-not-found|invalid-credential|wrong-password|invalid-login/.test(e.code||''))saveCred()})}});return}const k=A.cur;if(k&&A.users[k])loginAs(k);else{AUI.v='welcome';renderAuth();show('auth')}}

/* ---------- Editor item (Studio > Bikin Item) ---------- */
const DEFIT={shirt:{c1:'#ffd400',c2:'#1a1a1a',pat:'stripes'},face:{eye:'dot',mouth:'smile',col:'#111111',cheek:false},head:{shape:'round',c:null},hair:{style:'short',c:'#6b4226'},acc:{style:'glasses',c:'#111111'},anim:AN(.9,.9,1,0,0,0),emote:{steps:[{p:'waveA',d:.3},{p:'waveB',d:.3}],loops:2}};
const ITYPES=[['shirt','Baju'],['face','Muka'],['head','Kepala'],['hair','Rambut'],['acc','Aksesoris'],['anim','Animasi'],['emote','Emot']];
const OPT={pat:[['solid','Polos'],['stripes','Garis'],['vstripes','Garis tegak'],['dots','Polkadot'],['checker','Kotak'],['logo','Logo'],['split','Dua warna'],['belt','Sabuk']],
 eye:[['dot','Bulat'],['happy','Senang'],['wink','Kedip'],['angry','Garang'],['cute','Imut'],['sleepy','Ngantuk'],['cool','Cool']],
 mouth:[['smile','Senyum'],['open','Buka'],['flat','Datar'],['tongue','Julid'],['sad','Sedih'],['grin','Nyengir'],['o','O']],
 shape:[['box','Kotak'],['round','Bulat'],['tall','Lonjong'],['wide','Lebar'],['cyl','Tabung']],
 hstyle:[['none','Botak'],['short','Pendek'],['long','Panjang'],['spiky','Jambul'],['bun','Cepol'],['mohawk','Mohawk'],['pigtails','Kuncir dua'],['afro','Afro'],['ponytail','Kuncir kuda']],
 astyle:[['glasses','Kacamata'],['backpack','Ransel'],['wings','Sayap'],['cape','Jubah'],['halo','Halo'],['tie','Dasi'],['phones','Headphone'],['mask','Masker']]};
let IT={type:'shirt',data:clone(DEFIT.shirt)};
const PV={r:null,scene:null,cam:null,av:null,t:0,rig:'R6',yaw:.5,drag:false,emo:null};
const chips=(k,l,cur)=>'<div class="chs">'+l.map(o=>`<button type="button" class="${String(cur)===o[0]?'on':''}" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')+'</div>';
const colr=(k,v,lab)=>`<label class="fl">${lab}<input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#888888'}"></label>`;
const rng=(k,v,mn,mx,st,lab)=>`<label class="fl">${lab} <b>${v}</b><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`;
function renderItTabs(){$('#itTabs').innerHTML=ITYPES.map(t=>`<button type="button" class="${IT.type===t[0]?'on':''}" data-it="${t[0]}">${t[1]}</button>`).join('')}
function renderForm(){const d=IT.data,t=IT.type;let h='';
 if(t==='shirt')h='<div class="fh">Pola</div>'+chips('pat',OPT.pat,d.pat)+colr('c1',d.c1,'Warna utama')+colr('c2',d.c2,'Warna pola');
 else if(t==='face')h='<div class="fh">Mata</div>'+chips('eye',OPT.eye,d.eye)+'<div class="fh">Mulut</div>'+chips('mouth',OPT.mouth,d.mouth)+colr('col',d.col,'Warna garis')+`<div class="chs"><button type="button" class="${d.cheek?'on':''}" data-k="cheek" data-v="1">Pipi merona</button></div>`;
 else if(t==='head')h='<div class="fh">Bentuk kepala</div>'+chips('shape',OPT.shape,d.shape)+`<div class="fh">Warna</div><div class="chs"><button type="button" class="${d.c?'':'on'}" data-k="c" data-v="">Warna kulit</button></div>`+colr('c',d.c||'#ffd23f','Warna sendiri');
 else if(t==='hair')h='<div class="fh">Gaya rambut</div>'+chips('style',OPT.hstyle,d.style)+colr('c',d.c,'Warna rambut');
 else if(t==='acc')h='<div class="fh">Jenis aksesoris</div>'+chips('style',OPT.astyle,d.style)+colr('c',d.c,'Warna');
 else if(t==='anim')h='<div class="fh">Gaya jalan (lihat di preview)</div>'+rng('armSwing',d.armSwing,0,1.6,.05,'Ayun tangan')+rng('legSwing',d.legSwing,0,1.6,.05,'Ayun kaki')+rng('speed',d.speed,.5,2,.05,'Kecepatan')+rng('bounce',d.bounce,0,.5,.05,'Loncat kecil')+rng('lean',d.lean,0,.6,.05,'Condong ke depan')+rng('armsOut',d.armsOut,0,1.6,.05,'Tangan ke depan');
 else h='<div class="fh">Langkah gerakan (maks 6)</div>'+d.steps.map((s,i)=>`<div class="stp"><span>${i+1}</span><select data-si="${i}" data-f="p">${POSEN.map(p=>`<option value="${p[0]}" ${p[0]===s.p?'selected':''}>${p[1]}</option>`).join('')}</select><input type="range" data-si="${i}" data-f="d" min=".1" max="1.5" step=".05" value="${s.d}"><b>${s.d}s</b><button type="button" data-ia="del" data-i="${i}">&times;</button></div>`).join('')+(d.steps.length<6?'<button type="button" class="btn sm" data-ia="add">+ Tambah langkah</button>':'')+rng('loops',d.loops,1,6,1,'Diulang (kali)')+'<div class="muted" style="margin-top:8px">Emot bisa dipakai di R6 maupun R15.</div>';
 $('#itForm').innerHTML=h}
function initPrev(){if(PV.r)return;
 PV.r=new THREE.WebGLRenderer({canvas:$('#icanvas'),antialias:true});PV.scene=new THREE.Scene();PV.scene.background=new THREE.Color('#1b1b1b');
 PV.scene.add(new THREE.HemisphereLight(0xffffff,0x666677,.95));const d=new THREE.DirectionalLight(0xffffff,.6);d.position.set(3,6,5);PV.scene.add(d);
 const gr=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,.05,32),new THREE.MeshLambertMaterial({color:'#333333'}));gr.position.y=-.03;PV.scene.add(gr);
 PV.cam=new THREE.PerspectiveCamera(40,1,.1,50);new ResizeObserver(sizePrev).observe($('.itprev'));
 const cv=$('#icanvas');let px=null;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);px=gx(e);PV.drag=true});cv.addEventListener('pointermove',e=>{if(px!=null){PV.yaw-=(gx(e)-px)*.01;px=gx(e)}});['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{px=null;PV.drag=false}))}
function sizePrev(){if(!PV.r)return;const v=$('.itprev'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;PV.r.setSize(w,h,false);PV.cam.aspect=w/h;PV.cam.updateProjectionMatrix()}
function rebuildPrev(){if(!PV.r)return;if(PV.av)PV.scene.remove(PV.av.g);
 const it={id:'tmp',cat:IT.type,n:'tmp',p:0,data:IT.data};PV.av=buildAvatar(PV.rig,specOf(S.eq,{[IT.type]:it}));PV.scene.add(PV.av.g);PV.t=0;PV.emo=IT.type==='emote'?{E:IT.data,t:0}:null}
function tickPrev(dt){PV.t+=dt;if(!PV.drag)PV.yaw+=dt*.5;const av=PV.av;let pose={};
 if(IT.type==='emote'&&PV.emo){PV.emo.E=IT.data;PV.emo.t+=dt;if(PV.emo.t>=0){pose=emotePose(PV.emo.E,PV.emo.t);if(!pose){PV.emo.t=-.5;pose={}}}}
 else if(IT.type==='anim')pose=walkPose(IT.data,PV.t,6,false);else pose=walkPose(null,PV.t,0,false);
 applyPose(av,pose);av.g.rotation.y=PV.yaw+(av.spin||0);
 PV.cam.position.set(0,1.9,4.4);PV.cam.lookAt(0,.95,0);PV.r.render(PV.scene,PV.cam)}
function openItemEd(){lockLandscape();show('item');initPrev();IT={type:'shirt',data:clone(DEFIT.shirt)};PV.rig=S.rig;$$('.itrig button').forEach(x=>x.classList.toggle('on',x.dataset.rg===PV.rig));
 renderItTabs();renderForm();rebuildPrev();setTimeout(sizePrev,60)}
function pubItem(){const name=($('#itName').value||'').trim().slice(0,20);if(name.length<2){toast('Isi nama item dulu (min. 2 huruf)');return}
 const price=Math.max(0,Math.min(1000,Math.floor(+$('#itPrice').value||0)));
 const it={id:'u'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36),cat:IT.type,n:name,p:price,data:clone(IT.data),by:MYKEY,byName:ME,uid:CL.uid||'',date:Date.now()};
 MK.items.push(it);saveMK();if(cloudOn())CL.db.doc('items/'+it.id).set(it).catch(()=>toast('Gagal kirim item ke server'));S.owned.push(it.id);persist();$('#itName').value='';toast('Item "'+name+'" dipublikasikan di Toko!');beep(900,.2)}
$('#itTabs').addEventListener('click',e=>{const b=e.target.closest('[data-it]');if(!b)return;IT.type=b.dataset.it;IT.data=clone(DEFIT[IT.type]);renderItTabs();renderForm();rebuildPrev()});
$('#itForm').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ia==='add'){IT.data.steps.push({p:'rest',d:.3});renderForm();if(PV.emo)PV.emo.t=0;return}
 if(b.dataset.ia==='del'){if(IT.data.steps.length>1){IT.data.steps.splice(+b.dataset.i,1);renderForm();if(PV.emo)PV.emo.t=0}return}
 if(b.dataset.k!=null){const k=b.dataset.k,v=b.dataset.v;if(k==='cheek')IT.data.cheek=!IT.data.cheek;else IT.data[k]=(k==='c'&&v==='')?null:v;renderForm();rebuildPrev()}});
$('#itForm').addEventListener('input',e=>{const t=e.target;
 if(t.dataset.si!=null){const st=IT.data.steps[+t.dataset.si];if(!st)return;if(t.dataset.f==='p')st.p=t.value;else{st.d=parseFloat(t.value);if(t.nextElementSibling)t.nextElementSibling.textContent=st.d+'s'}if(PV.emo)PV.emo.t=0;return}
 if(t.dataset.k){const v=t.type==='range'?parseFloat(t.value):t.value;IT.data[t.dataset.k]=t.dataset.k==='loops'?Math.round(v):v;const b=t.parentNode.querySelector('b');if(b&&t.type==='range')b.textContent=IT.data[t.dataset.k];if(IT.type!=='anim'&&IT.type!=='emote')rebuildPrev();else if(PV.emo)PV.emo.t=0}});
$('.itrig').addEventListener('click',e=>{const b=e.target.closest('[data-rg]');if(!b)return;PV.rig=b.dataset.rg;$$('.itrig button').forEach(x=>x.classList.toggle('on',x.dataset.rg===PV.rig));rebuildPrev()});
$('#pkGame').onclick=()=>openGameStudio(null);$('#pkItem').onclick=openItemEd;$('#pkExit').onclick=closeStudio;
$('#itExit').onclick=()=>show('pick');$('#itPub').onclick=pubItem;$$('.rbk').forEach(b=>b.onclick=closeStudio);

/* ---------- Loop utama ---------- */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(screenName==='game'&&GM){if(!GM.paused)tickGame(dt);gR.render(GM.scene,gCam)}
 else if(screenName==='item'&&PV.r&&PV.av)tickPrev(dt);
 else if(screenName==='studio'&&sR&&W){const cp=Math.cos(cam.pitch);sCam.position.set(cam.tx+Math.sin(cam.yaw)*cp*cam.dist,cam.ty+Math.sin(cam.pitch)*cam.dist,cam.tz+Math.cos(cam.yaw)*cp*cam.dist);sCam.lookAt(cam.tx,cam.ty,cam.tz);sR.render(sScene,sCam)}}
addEventListener('resize',()=>{applyFR();resizeStudio()});
{const dr=$('#drawer'),closeD=()=>dr.classList.add('hidden');
 $('#menuBtn').onclick=()=>{updateChips();dr.classList.remove('hidden')};$('.dback').onclick=closeD;
 dr.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;closeD();const g=b.dataset.go;
  if(g==='logout')logout();else if(g==='studio')openStudio(null);else if(g==='help')alertD('REblox: main game untuk dapat ⚡FET (6 per menit), tukar 3 FET = 1 reBux di menu Penukaran, lalu belanja di Toko. Tombol Studio untuk bikin map sendiri.');else if(g==='myprof'){PROF=MYKEY;setTab('prof')}else setTab(g)});
 $('#searchBtn').onclick=()=>{promptD('Cari game:',q,'Nama game').then(v=>{if(v!==null){q=v.trim().toLowerCase();setTab('home')}})};
 $('#rbBtn').onclick=()=>setTab('ex');
 $('#bellBtn').onclick=()=>{setTab('home');toast(S.lastDaily!==today()?'Hadiah harian menunggu!':'Tidak ada notifikasi baru')}}
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));boot();requestAnimationFrame(loop);
})();
